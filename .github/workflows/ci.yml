name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (no PMD, Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    env:
      CODEHEALTH_NO_PMD: "1"
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run python scripts/dogfood.py

  pmd:
    name: tests with PMD (Java 21)
    runs-on: ubuntu-latest
    env:
      CODEHEALTH_PMD_HOME: ${{ github.workspace }}/tools/pmd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run codehealth install-pmd
      - name: PMD is found (fail instead of skipping)
        run: uv run python -c "from codehealth import pmd; i, r = pmd.locate(); assert i, r; print(i)"
      - run: uv run pytest -m pmd
      - run: uv run pytest

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: wheel installs and runs in an isolated environment
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" codehealth-mcp --version
          uv run --isolated --no-project --with "$wheel" codehealth --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
